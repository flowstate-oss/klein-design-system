name: Publish documentation
on:
  push:
    branches: [main]
    paths: ['apps/docs/**', 'packages/**', 'scripts/**', 'package*.json', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build:docs
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build
  deploy:
    if: vars.ENABLE_DOCS_DEPLOY == 'true' && github.repository == 'flowstate-oss/klein-design-system' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
