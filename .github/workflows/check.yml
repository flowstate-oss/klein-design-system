name: Klein contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: node scripts/check-release-version.mjs
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm ci
      - run: npm run check
      - run: npm run build:docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run smoke:pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klein-docs-and-evidence
          path: |
            apps/docs/build
            artifacts
            test-results
